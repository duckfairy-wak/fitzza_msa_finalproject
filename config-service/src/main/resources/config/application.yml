eureka:
  client:
    service-url:
      defaultZone: ${DISCOVERY_SERVICE_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        # 메트릭(Prometheus)만 연다. 각 서비스는 일반 API와 다른 관리 포트(management.server.port)에서만 응답하므로
        # Gateway·Ingress를 거쳐 외부로 나가지 않는다. Config·Discovery는 자체 설정에서 계속 모두 막는다.
        include: prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # p90/p95/p99는 Prometheus에서 histogram_quantile로 계산한다. 버킷 수를 고정해 시계열 수가 늘지 않게 한다.
      slo:
        http.server.requests: 25ms,50ms,100ms,250ms,500ms,1s,2500ms,5s,10s
  tracing:
    sampling:
      # 기본 꺼짐(운영 안전). 로컬 Compose는 MANAGEMENT_TRACING_SAMPLING_PROBABILITY=1.0 으로 켠다.
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:0.0}
  otlp:
    tracing:
      endpoint: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"

spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:fitzza}
    username: ${POSTGRES_USER:fitzza}
    password: ${POSTGRES_PASSWORD:fitzza_local}
    hikari:
      connection-timeout: 3000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:fitzza_local}
