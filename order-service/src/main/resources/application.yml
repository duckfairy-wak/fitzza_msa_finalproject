server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: order-service
  config:
    import: optional:configserver:${CONFIG_SERVICE_URL:http://localhost:8888}
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:fitzza}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD}
    hikari:
      schema: order_service
  flyway:
    enabled: true
    schemas: order_service
    default-schema: order_service
    create-schemas: true
    baseline-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: order_service
        hbm2ddl:
          create_namespaces: true
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 3000

eureka:
  client:
    service-url:
      defaultZone: ${DISCOVERY_SERVICE_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        exclude: "*"

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

fitzza:
  # product-service 서비스 전용 API를 호출할 때 붙이는 이 서비스의 토큰
  service-token: ${ORDER_SERVICE_TOKEN}
  # 이 서비스의 서비스 전용 API를 호출하는 서비스별 토큰. 서비스마다 다른 32바이트 이상 값을 쓴다.
  service-tokens:
    community: ${COMMUNITY_SERVICE_TOKEN:}
    review: ${REVIEW_SERVICE_TOKEN}
  clients:
    product:
      # 비어 있으면 Eureka의 product-service 인스턴스로 로드밸런싱한다. 로컬 단독 실행 시 http://localhost:8082를 지정한다.
      url: ${PRODUCT_SERVICE_URL:}
