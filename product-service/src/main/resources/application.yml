server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: product-service
  config:
    import: optional:configserver:${CONFIG_SERVICE_URL:http://localhost:8888}
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:fitzza}
    username: ${PRODUCT_SERVICE_DB_USER}
    password: ${PRODUCT_SERVICE_DB_PASSWORD}
    hikari:
      schema: product_service
  flyway:
    enabled: true
    schemas: product_service
    default-schema: product_service
    create-schemas: true
    baseline-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: product_service
        hbm2ddl:
          create_namespaces: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  cloud:
    aws:
      region:
        static: ${AWS_DEFAULT_REGION:ap-northeast-2}

eureka:
  client:
    service-url:
      defaultZone: ${DISCOVERY_SERVICE_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        exclude: "*"

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

# 이 서비스가 다른 서비스를 호출할 때 보내는 토큰. 호출을 붙이기 전에는 비워 둔다.
# 이 서비스의 서비스 전용 API를 호출하는 서비스별 토큰. 서비스마다 다른 32바이트 이상 값을 쓴다.
fitzza:
  service-token: ${PRODUCT_SERVICE_TOKEN:}
  service-tokens:
    community: ${COMMUNITY_SERVICE_TOKEN}
    order: ${ORDER_SERVICE_TOKEN}
    recommendation: ${RECOMMENDATION_SERVICE_TOKEN:}
  seed:
    musinsa:
      # 시작 시 무신사 크롤링 JSON을 DB에 저장한다. 이미 저장된 상품은 건너뛴다.
      enabled: ${MUSINSA_SEED_ENABLED:true}
      location: ${MUSINSA_SEED_LOCATION:classpath*:final_products/**/*.json}
  migration:
    category-code:
      # 한글 카테고리 이름이 남은 상품이 있으면 기동 시 코드로 바꾼다. 남은 상품이 없으면 아무것도 하지 않는다.
      enabled: ${CATEGORY_CODE_MIGRATION_ENABLED:true}
  # 비공개 데이터 버킷의 상품 이미지 object key → Presigned GET URL.
  # DB에는 key(또는 기존 HTTPS URL)를 두고, 응답 직전 imageUrl/thumbnailUrl/images에 서명 URL을 넣는다.
  # 현재 crawl 적재 키 prefix 예: pipeline/runs/<run-id>/images/products/
  product-images:
    presign-enabled: ${PRODUCT_IMAGE_PRESIGN_ENABLED:false}
    bucket: ${PRODUCT_IMAGE_S3_BUCKET:}
    presign-ttl: ${PRODUCT_IMAGE_PRESIGN_TTL:1h}
