name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test --no-daemon

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [vton-service, recommendation-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ${{ matrix.service }}/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: ${{ matrix.service }}
      - run: python -m pytest tests
        working-directory: ${{ matrix.service }}

  delivery-scope:
    runs-on: ubuntu-latest
    env:
      KUBECTL_VERSION: v1.36.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==8.3.3 PyYAML==6.0.2
      - name: Install kubectl
        run: |
          curl --fail --silent --show-error --location --output /tmp/kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          curl --fail --silent --show-error --location --output /tmp/kubectl.sha256 "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl.sha256"
          echo "$(cat /tmp/kubectl.sha256)  /tmp/kubectl" | sha256sum --check
          sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
      # Fail here instead of letting the overlay test skip when a prerequisite is missing.
      - run: kubectl version --client && python -c "import yaml"
      - run: python -m pytest tests/test_delivery_scope.py

  pipeline-orchestration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==8.3.3 PyYAML==6.0.3 boto3==1.35.36 cfn-lint==1.59.0
      # Static checks only: no AWS credentials are used and nothing is deployed.
      - run: python -m pytest tests/test_orchestration_*.py tests/test_eks_kubernetes_api.py tests/test_package_orchestration_lambda.py tests/test_integrity_check.py
      - run: cfn-lint --regions ap-northeast-2 -- infra/aws/cloudformation/orchestration.yaml
