spring:
  application:
    name: user-service
  config:
    import: optional:configserver:${CONFIG_SERVICE_URL:http://localhost:8888}
  data:
    redis:
      repositories:
        enabled: false

# 이 서비스의 서비스 전용 API(/users)를 호출하는 서비스별 토큰. 서비스마다 다른 32바이트 이상 값을 쓴다.
fitzza:
  service-tokens:
    community: ${COMMUNITY_SERVICE_TOKEN}
    recommendation: ${RECOMMENDATION_SERVICE_TOKEN:}

jwt:
  secret: ${JWT_SECRET}
  expiration-seconds: ${JWT_ACCESS_EXPIRATION_SECONDS:900}
  refresh-expiration-seconds: ${JWT_REFRESH_EXPIRATION_SECONDS:2592000}

management:
  server:
    # 메트릭은 일반 API(user-service 포트)와 다른 이 포트에서만 연다. Gateway·Ingress·Service의 http 포트가
    # 이 포트로 라우팅하지 않으므로 클러스터 밖에 노출되지 않는다. Prometheus만 이 포트를 수집한다.
    port: ${MANAGEMENT_SERVER_PORT:9081}
  endpoints:
    web:
      exposure:
        include: prometheus

# 로그 줄마다 Gateway가 붙인 요청 ID(X-Request-Id)를 함께 찍는다.
logging:
  pattern:
    level: "%5p [%X{requestId:-}]"

auth:
  refresh-cookie:
    secure: ${REFRESH_COOKIE_SECURE:false}
