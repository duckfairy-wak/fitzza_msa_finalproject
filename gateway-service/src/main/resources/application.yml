server:
  port: 8080
spring:
  application:
    name: gateway-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: lb://user-service
          predicates: [Path=/api/v1/users/**]
        - id: user-service-auth
          uri: lb://user-service
          predicates: [Path=/api/v1/auth/**]
        - id: product-service
          uri: lb://product-service
          predicates: [Path=/api/v1/products/**]
        - id: order-service
          uri: lb://order-service
          predicates: [Path=/api/v1/orders/**]
        - id: community-service
          uri: lb://community-service
          predicates: [Path=/api/v1/community/**]
        - id: review-service
          uri: lb://review-service
          predicates: [Path=/api/v1/reviews/**]
        - id: notification-service
          uri: lb://notification-service
          predicates: [Path=/api/v1/notifications/**]
        - id: virtual-tryon-service
          uri: ${VIRTUAL_TRYON_URL:http://localhost:8091}
          predicates: [Path=/api/v1/tryon/**]
        - id: recommendation-service
          uri: ${RECOMMENDATION_URL:http://localhost:8092}
          predicates: [Path=/api/v1/recommendations/**]
jwt:
  secret: ${JWT_SECRET}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      probes:
        enabled: true
