server:
  port: 8080
spring:
  application:
    name: gateway-service
  config:
    import: optional:configserver:${CONFIG_SERVICE_URL:http://localhost:8888}
  data:
    redis:
      repositories:
        enabled: false
  cloud:
    gateway:
      # 명시적으로 허용한 FE 주소에서 HttpOnly Refresh Token 쿠키를 전송할 수 있게 한다.
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowCredentials: true
            allowedOrigins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
            allowedMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
            allowedHeaders: "*"
            # 브라우저 코드가 응답의 요청 ID를 읽어 오류 문의 때 알려줄 수 있게 한다.
            exposedHeaders: [X-Request-Id]
            maxAge: 3600
      # FE는 /api/v1/**, 스웨거·기존 호출은 /api/** 를 쓴다. 서비스는 /api 를 받으므로
      # /api/v1 요청은 RewritePath로 /api 로 넘긴다. recommendations는 서비스가 이미 /api/v1 이라 그대로 둔다.
      routes:
        - id: vton-service
          uri: ${VTON_SERVICE_URL:http://localhost:8091}
          predicates: ["Path=/api/vton,/api/vton/**,/api/v1/vton,/api/v1/vton/**"]
          filters:
            - RewritePath=/api/v1/(?<segment>.*), /api/$\{segment}
        - id: recommendation-service
          uri: ${RECOMMENDATION_SERVICE_URL:http://localhost:8092}
          predicates: [Path=/api/v1/recommendations/**]
        - id: user-service
          uri: lb://user-service
          predicates: ["Path=/api/users/**,/api/v1/users/**"]
          filters:
            - RewritePath=/api/v1/(?<segment>.*), /api/$\{segment}
        - id: user-service-auth
          uri: lb://user-service
          predicates: ["Path=/api/auth/**,/api/v1/auth/**"]
          filters:
            - RewritePath=/api/v1/(?<segment>.*), /api/$\{segment}
        - id: product-service-products
          uri: lb://product-service
          predicates: ["Path=/api/products,/api/products/**,/api/v1/products,/api/v1/products/**"]
          filters:
            - RewritePath=/api/v1/(?<segment>.*), /api/$\{segment}
        - id: product-service-categories
          uri: lb://product-service
          predicates: ["Path=/api/categories,/api/categories/**,/api/v1/categories,/api/v1/categories/**"]
          filters:
            - RewritePath=/api/v1/(?<segment>.*), /api/$\{segment}
        - id: product-service-wishlists
          uri: lb://product-service
          predicates: ["Path=/api/wishlists,/api/wishlists/**,/api/v1/wishlists,/api/v1/wishlists/**"]
          filters:
            - RewritePath=/api/v1/(?<segment>.*), /api/$\{segment}
        - id: product-service-worldcups
          uri: lb://product-service
          predicates: ["Path=/api/worldcups,/api/worldcups/**,/api/v1/worldcups,/api/v1/worldcups/**"]
          filters:
            - RewritePath=/api/v1/(?<segment>.*), /api/$\{segment}
        - id: order-service-orders
          uri: lb://order-service
          predicates: ["Path=/api/orders,/api/orders/**,/api/v1/orders,/api/v1/orders/**"]
          filters:
            - RewritePath=/api/v1/(?<segment>.*), /api/$\{segment}
        - id: order-service-carts
          uri: lb://order-service
          predicates: ["Path=/api/carts,/api/carts/**,/api/v1/carts,/api/v1/carts/**"]
          filters:
            - RewritePath=/api/v1/(?<segment>.*), /api/$\{segment}
        - id: community-service
          uri: lb://community-service
          predicates: ["Path=/api/community/**,/api/v1/community/**"]
          filters:
            - RewritePath=/api/v1/(?<segment>.*), /api/$\{segment}
        # 명세서의 댓글 수정·삭제·좋아요 경로는 /api/comments/** 다(작성·목록만 /api/community/posts/{postId}/comments).
        - id: community-service-comments
          uri: lb://community-service
          predicates: ["Path=/api/comments/**,/api/v1/comments/**"]
          filters:
            - RewritePath=/api/v1/(?<segment>.*), /api/$\{segment}
        - id: review-service
          uri: lb://review-service
          predicates: ["Path=/api/reviews,/api/reviews/**,/api/v1/reviews,/api/v1/reviews/**"]
          filters:
            - RewritePath=/api/v1/(?<segment>.*), /api/$\{segment}
        - id: review-service-surveys
          uri: lb://review-service
          predicates: ["Path=/api/surveys,/api/surveys/**,/api/v1/surveys,/api/v1/surveys/**"]
          filters:
            - RewritePath=/api/v1/(?<segment>.*), /api/$\{segment}
        - id: notification-service
          uri: lb://notification-service
          predicates: ["Path=/api/notifications/**,/api/v1/notifications/**"]
          filters:
            - RewritePath=/api/v1/(?<segment>.*), /api/$\{segment}
# Swagger UI는 Gateway 한 곳(/swagger-ui.html)에서 열고, 서비스는 오른쪽 위 목록에서 고른다.
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: user-service
        url: /api-docs/user-service
      - name: product-service
        url: /api-docs/product-service
      - name: order-service
        url: /api-docs/order-service
      - name: community-service
        url: /api-docs/community-service
      - name: notification-service
        url: /api-docs/notification-service
      - name: review-service
        url: /api-docs/review-service
jwt:
  secret: ${JWT_SECRET}
eureka:
  client:
    service-url:
      defaultZone: ${DISCOVERY_SERVICE_URL:http://localhost:8761/eureka/}
management:
  endpoints:
    web:
      exposure:
        exclude: "*"
