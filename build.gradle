plugins {
    id 'org.springframework.boot' version '3.3.5' apply false
    id 'io.spring.dependency-management' version '1.1.6' apply false
}

allprojects {
    group = 'com.fitzza'
    version = '0.1.0-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'org.springframework.boot'
    apply plugin: 'io.spring.dependency-management'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    dependencyManagement {
        imports {
            mavenBom 'org.springframework.cloud:spring-cloud-dependencies:2023.0.3'
        }
    }

    dependencies {
        // Config/Discovery는 Eureka·설정 트래픽이 많아 추적 대상에서 제외한다.
        if (name != 'config-service' && name != 'discovery-service') {
            // Micrometer Tracing → OTLP(Jaeger). yml 기본 샘플링 0.0, Compose는 1.0으로 켠다.
            implementation 'io.micrometer:micrometer-tracing-bridge-otel'
            implementation 'io.opentelemetry:opentelemetry-exporter-otlp'
            // Prometheus 메트릭(/actuator/prometheus). 일반 API와 다른 관리 포트에서만 연다(각 서비스 application.yml).
            runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
        }
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
    }

    tasks.named('test') {
        useJUnitPlatform()
    }
}
