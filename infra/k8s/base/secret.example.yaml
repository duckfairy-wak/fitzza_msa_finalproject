apiVersion: v1
kind: Secret
metadata:
  name: fitzza-app-secrets
  namespace: fitzza
type: Opaque
# Documents the 13 required application Secret keys only.
# Optional product/order DB accounts (PRODUCT_SERVICE_DB_*, ORDER_SERVICE_DB_*)
# are Compose/.env fallbacks — see .env.example and infra/postgres/README.md.
# Do not list them under stringData; validate_app_secrets requires exactly these keys.
stringData:
  POSTGRES_USER: CHANGE_ME
  POSTGRES_PASSWORD: CHANGE_ME
  USER_SERVICE_DB_USER: user_service_app
  USER_SERVICE_DB_PASSWORD: CHANGE_ME
  PRODUCT_SERVICE_DB_USER: product_service_app
  PRODUCT_SERVICE_DB_PASSWORD: CHANGE_ME
  ORDER_SERVICE_DB_USER: order_service_app
  ORDER_SERVICE_DB_PASSWORD: CHANGE_ME
  COMMUNITY_SERVICE_DB_USER: community_service_app
  COMMUNITY_SERVICE_DB_PASSWORD: CHANGE_ME
  REVIEW_SERVICE_DB_USER: review_service_app
  REVIEW_SERVICE_DB_PASSWORD: CHANGE_ME
  NOTIFICATION_SERVICE_DB_USER: notification_service_app
  NOTIFICATION_SERVICE_DB_PASSWORD: CHANGE_ME
  REDIS_PASSWORD: CHANGE_ME
  JWT_SECRET: CHANGE_ME_AT_LEAST_32_BYTES
  COMMUNITY_SERVICE_TOKEN: CHANGE_ME_AT_LEAST_32_BYTES
  ORDER_SERVICE_TOKEN: CHANGE_ME_AT_LEAST_32_BYTES
  RECOMMENDATION_SERVICE_TOKEN: CHANGE_ME_AT_LEAST_32_BYTES
  VTON_SERVICE_TOKEN: CHANGE_ME_AT_LEAST_32_BYTES
  PRODUCT_SERVICE_TOKEN: CHANGE_ME_AT_LEAST_32_BYTES
  REVIEW_SERVICE_TOKEN: CHANGE_ME_AT_LEAST_32_BYTES
  RECOMMENDATION_REDIS_URL: redis://:CHANGE_ME@redis:6379/1
  VTON_REDIS_URL: redis://:CHANGE_ME@redis:6379/0
  OPENAI_API_KEY: CHANGE_ME
