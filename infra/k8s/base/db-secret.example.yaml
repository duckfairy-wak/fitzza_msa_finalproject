apiVersion: v1
kind: Secret
metadata:
  name: fitzza-db-secrets
  namespace: fitzza
type: Opaque
# Documents service-specific database credentials only.
# Do not apply this file. Populate the Secret from the approved secret store.
stringData:
  USER_SERVICE_DB_USER: user_service_app
  USER_SERVICE_DB_PASSWORD: CHANGE_ME
  PRODUCT_SERVICE_DB_USER: product_service_app
  PRODUCT_SERVICE_DB_PASSWORD: CHANGE_ME
  ORDER_SERVICE_DB_USER: order_service_app
  ORDER_SERVICE_DB_PASSWORD: CHANGE_ME
  COMMUNITY_SERVICE_DB_USER: community_service_app
  COMMUNITY_SERVICE_DB_PASSWORD: CHANGE_ME
  REVIEW_SERVICE_DB_USER: review_service_app
  REVIEW_SERVICE_DB_PASSWORD: CHANGE_ME
  NOTIFICATION_SERVICE_DB_USER: notification_service_app
  NOTIFICATION_SERVICE_DB_PASSWORD: CHANGE_ME
