apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-service
  labels: { app.kubernetes.io/name: config-service, fitzza.io/workload: application }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: config-service }
  template:
    metadata:
      labels: { app.kubernetes.io/name: config-service }
    spec:
      serviceAccountName: fitzza-application
      containers:
        - name: config-service
          image: fitzza/config-service:latest
          imagePullPolicy: Always
          ports: [{ name: http, containerPort: 8888 }]
          envFrom:
            - configMapRef: { name: fitzza-app-config }
            - secretRef: { name: fitzza-app-secrets }
---
apiVersion: v1
kind: Service
metadata:
  name: config-service
spec:
  selector: { app.kubernetes.io/name: config-service }
  ports: [{ name: http, port: 8888, targetPort: http }]
---
