apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommendation-service
  labels: { app.kubernetes.io/name: recommendation-service, fitzza.io/workload: application }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: recommendation-service }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: recommendation-service
        fitzza.io/qdrant-client: "true"
    spec:
      serviceAccountName: fitzza-application
      containers:
        - name: recommendation-service
          image: fitzza/recommendation-service:latest
          imagePullPolicy: Always
          ports: [{ name: http, containerPort: 8000 }]
          env:
            - name: REDIS_URL
              valueFrom:
                secretKeyRef: { name: fitzza-app-secrets, key: RECOMMENDATION_REDIS_URL }
          envFrom:
            - configMapRef: { name: fitzza-app-config }
            - secretRef: { name: fitzza-app-secrets }
---
