apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
labels:
  - pairs:
      app.kubernetes.io/part-of: fitzza
      environment: prod
patches:
  - target:
      kind: ConfigMap
      name: fitzza-app-config
    patch: |-
      - op: add
        path: /data/MANAGEMENT_OTLP_TRACING_ENDPOINT
        value: http://jaeger:4318/v1/traces
      - op: add
        path: /data/MANAGEMENT_TRACING_SAMPLING_PROBABILITY
        value: "0.1"
  - target:
      kind: Deployment
      labelSelector: fitzza.io/workload=application
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/startupProbe/failureThreshold
        value: 120
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 25m
      - op: add
        path: /spec/strategy
        value:
          type: RollingUpdate
          rollingUpdate:
            maxSurge: 0
            maxUnavailable: 1
      - op: add
        path: /spec/progressDeadlineSeconds
        value: 900
  - target:
      kind: Deployment
      name: config-service
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env
        value:
          - name: SPRING_PROFILES_ACTIVE
            value: native,prod
  - target:
      kind: Deployment
      name: gateway-service
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env
        value:
          - name: SPRING_CONFIG_IMPORT
            value: configserver:http://config-service:8888
  - target:
      kind: Deployment
      name: (user-service|product-service|order-service|community-service|review-service|notification-service)
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: SPRING_CONFIG_IMPORT
          value: configserver:http://config-service:8888
images:
  - name: fitzza/config-service
    newName: CHANGE_ME_ECR_REGISTRY/CHANGE_ME_ECR_REPOSITORY_PREFIX/config-service
    newTag: CHANGE_ME_COMMIT_TAG
  - name: fitzza/discovery-service
    newName: CHANGE_ME_ECR_REGISTRY/CHANGE_ME_ECR_REPOSITORY_PREFIX/discovery-service
    newTag: CHANGE_ME_COMMIT_TAG
  - name: fitzza/gateway-service
    newName: CHANGE_ME_ECR_REGISTRY/CHANGE_ME_ECR_REPOSITORY_PREFIX/gateway-service
    newTag: CHANGE_ME_COMMIT_TAG
  - name: fitzza/user-service
    newName: CHANGE_ME_ECR_REGISTRY/CHANGE_ME_ECR_REPOSITORY_PREFIX/user-service
    newTag: CHANGE_ME_COMMIT_TAG
  - name: fitzza/product-service
    newName: CHANGE_ME_ECR_REGISTRY/CHANGE_ME_ECR_REPOSITORY_PREFIX/product-service
    newTag: CHANGE_ME_COMMIT_TAG
  - name: fitzza/order-service
    newName: CHANGE_ME_ECR_REGISTRY/CHANGE_ME_ECR_REPOSITORY_PREFIX/order-service
    newTag: CHANGE_ME_COMMIT_TAG
  - name: fitzza/community-service
    newName: CHANGE_ME_ECR_REGISTRY/CHANGE_ME_ECR_REPOSITORY_PREFIX/community-service
    newTag: CHANGE_ME_COMMIT_TAG
  - name: fitzza/review-service
    newName: CHANGE_ME_ECR_REGISTRY/CHANGE_ME_ECR_REPOSITORY_PREFIX/review-service
    newTag: CHANGE_ME_COMMIT_TAG
  - name: fitzza/notification-service
    newName: CHANGE_ME_ECR_REGISTRY/CHANGE_ME_ECR_REPOSITORY_PREFIX/notification-service
    newTag: CHANGE_ME_COMMIT_TAG
  - name: fitzza/recommendation-service
    newName: CHANGE_ME_ECR_REGISTRY/CHANGE_ME_ECR_REPOSITORY_PREFIX/recommendation-service
    newTag: CHANGE_ME_COMMIT_TAG
  - name: fitzza/vton-service
    newName: CHANGE_ME_ECR_REGISTRY/CHANGE_ME_ECR_REPOSITORY_PREFIX/vton-service
    newTag: CHANGE_ME_COMMIT_TAG
