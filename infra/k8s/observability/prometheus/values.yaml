# FITZZA-308: values for prometheus-community/kube-prometheus-stack 92.14.1.
# Secrets are deliberately excluded. Create the Grafana admin Secret before install.
fullnameOverride: fitzza-monitoring

defaultRules:
  create: false

alertmanager:
  enabled: false

grafana:
  enabled: true
  admin:
    existingSecret: fitzza-grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  service:
    type: ClusterIP
  ingress:
    enabled: false
  persistence:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

prometheusOperator:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
  admissionWebhooks:
    patch:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 50m
          memory: 64Mi

prometheus:
  service:
    type: ClusterIP
  prometheusSpec:
    scrapeInterval: 60s
    evaluationInterval: 60s
    retention: 7d
    retentionSize: 8GB
    walCompression: true
    resources:
      requests:
        cpu: 150m
        memory: 384Mi
      limits:
        cpu: 500m
        memory: 768Mi
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          storageClassName: fitzza-gp3-retain
          resources:
            requests:
              storage: 10Gi

kube-state-metrics:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 50m
      memory: 64Mi
