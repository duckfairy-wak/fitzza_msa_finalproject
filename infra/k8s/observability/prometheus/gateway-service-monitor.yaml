apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: gateway-service
  namespace: fitzza-monitoring
  labels:
    release: fitzza-monitoring
spec:
  namespaceSelector:
    matchNames:
      - fitzza
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway-service
  endpoints:
    - port: metrics
      path: /actuator/prometheus
      interval: 30s
      scrapeTimeout: 10s
