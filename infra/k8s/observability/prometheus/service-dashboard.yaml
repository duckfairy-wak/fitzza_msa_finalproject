apiVersion: v1
kind: ConfigMap
metadata:
  name: fitzza-service-overview-dashboard
  namespace: fitzza-monitoring
  labels:
    grafana_dashboard: "1"
data:
  fitzza-service-overview.json: |-
    {
      "annotations": {"list": []},
      "editable": false,
      "graphTooltip": 1,
      "panels": [
        {
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "fieldConfig": {"defaults": {"unit": "reqps"}},
          "gridPos": {"h": 8, "w": 8, "x": 0, "y": 0},
          "id": 1,
          "targets": [{"expr": "sum by (application) (rate(http_server_requests_seconds_count{application=~\"$service\"}[5m]))", "legendFormat": "{{application}}"}],
          "title": "Request rate",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "fieldConfig": {"defaults": {"unit": "percentunit"}},
          "gridPos": {"h": 8, "w": 8, "x": 8, "y": 0},
          "id": 2,
          "targets": [{"expr": "sum by (application) (rate(http_server_requests_seconds_count{application=~\"$service\",status=~\"5..\"}[5m])) / clamp_min(sum by (application) (rate(http_server_requests_seconds_count{application=~\"$service\"}[5m])), 0.000001)", "legendFormat": "{{application}}"}],
          "title": "5xx error ratio",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "fieldConfig": {"defaults": {"unit": "s"}},
          "gridPos": {"h": 8, "w": 8, "x": 16, "y": 0},
          "id": 3,
          "targets": [
            {"expr": "histogram_quantile(0.90, sum by (le, application) (rate(http_server_requests_seconds_bucket{application=~\"$service\"}[5m])))", "legendFormat": "p90 {{application}}"},
            {"expr": "histogram_quantile(0.95, sum by (le, application) (rate(http_server_requests_seconds_bucket{application=~\"$service\"}[5m])))", "legendFormat": "p95 {{application}}"},
            {"expr": "histogram_quantile(0.99, sum by (le, application) (rate(http_server_requests_seconds_bucket{application=~\"$service\"}[5m])))", "legendFormat": "p99 {{application}}"}
          ],
          "title": "Request latency",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "gridPos": {"h": 7, "w": 8, "x": 0, "y": 8},
          "id": 4,
          "targets": [{"expr": "up{namespace=~\"$namespace\",service=~\"$service\"}", "legendFormat": "{{service}}"}],
          "title": "Prometheus targets",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "fieldConfig": {"defaults": {"unit": "bytes"}},
          "gridPos": {"h": 7, "w": 8, "x": 8, "y": 8},
          "id": 5,
          "targets": [{"expr": "sum by (application) (jvm_memory_used_bytes{application=~\"$service\",area=\"heap\"})", "legendFormat": "JVM {{application}}"}, {"expr": "sum by (job) (process_resident_memory_bytes{job=~\"$service\"})", "legendFormat": "process {{job}}"}],
          "title": "Runtime memory",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "gridPos": {"h": 7, "w": 8, "x": 16, "y": 8},
          "id": 6,
          "targets": [{"expr": "sum by (pod) (increase(kube_pod_container_status_restarts_total{namespace=~\"$namespace\"}[1h]))", "legendFormat": "{{pod}}"}],
          "title": "Pod restarts (1h)",
          "type": "timeseries"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 41,
      "tags": ["fitzza", "service", "FITZZA-177"],
      "templating": {
        "list": [
          {"current": {}, "label": "Data source", "name": "datasource", "query": "prometheus", "type": "datasource"},
          {"allValue": ".*", "includeAll": true, "label": "Namespace", "name": "namespace", "query": {"query": "label_values(up, namespace)", "refId": "PrometheusVariableQueryEditor-namespace"}, "refresh": 1, "type": "query"},
          {"allValue": ".*", "includeAll": true, "label": "Service", "name": "service", "query": {"query": "label_values(http_server_requests_seconds_count, application)", "refId": "PrometheusVariableQueryEditor-service"}, "refresh": 1, "type": "query"}
        ]
      },
      "time": {"from": "now-1h", "to": "now"},
      "timezone": "browser",
      "title": "FITZZA Service Overview",
      "uid": "fitzza-service-overview",
      "version": 1
    }
