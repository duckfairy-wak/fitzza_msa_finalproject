apiVersion: v1
kind: ServiceAccount
metadata:
  name: fitzza-jev
  namespace: fitzza
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: Job
metadata:
  name: jev-color-20261025-01
  namespace: fitzza
  annotations:
    fitzza.io/execution-policy: manual-approval-required
  labels:
    fitzza.io/run-id: collection-20261025-01
spec:
  suspend: true
  backoffLimit: 0
  activeDeadlineSeconds: 2100
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fitzza-jev
    spec:
      serviceAccountName: fitzza-jev
      automountServiceAccountToken: false
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/arch: arm64
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: jev
          image: 414901227428.dkr.ecr.ap-northeast-2.amazonaws.com/fitzza/crawler:jev-manifest-20261027-01
          command: ["python", "-m", "src.jev_job"]
          args: ["--bucket", "fitzza-prod-foundation-databucket-wwng6wfc0hqy", "--run-id", "collection-20261025-01", "--input-layout", "manifest"]
          env:
            - name: AWS_REGION
              value: ap-northeast-2
            - name: HOME
              value: /work
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 2Gi
            limits:
              cpu: 500m
              memory: 1Gi
              ephemeral-storage: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: work
              mountPath: /work
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: work
          emptyDir:
            sizeLimit: 3Gi
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
